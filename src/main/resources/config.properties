site=https://www.steamgifts.com/
# Secrets: do NOT put real values here, this file is committed.
# Provide them via env vars (cookie, cf_clearance) or a git-ignored
# config.local.properties in the working directory (overrides this file).
cookie=
cf_clearance=

# --- Local browser modes (to bypass captcha when running locally) ---
# Option A: Launch Chrome with your real profile (zero interaction, captcha likely skipped).
# Set this to your Chrome user data directory, e.g.:
#   macOS: /Users/you/Library/Application Support/Google/Chrome
#   Linux: /home/you/.config/google-chrome
#   Windows: C:\Users\you\AppData\Local\Google\Chrome\User Data
# Chrome must NOT be running when you start the app.
chrome_profile_dir=

# Option B: Attach to an already-running Chrome (minimal interaction).
# Start Chrome with: google-chrome --remote-debugging-port=9222 --user-data-dir=/tmp/chrome-debug
# Then navigate to steamgifts.com, solve captcha if prompted, and run the app.
# Leave empty to disable.
local_browser_port=9222