site=https://www.steamgifts.com/
# Secrets: do NOT put real values here, this file is committed.
# Provide them via env vars (cookie, cf_clearance) or a git-ignored
# config.local.properties in the working directory (overrides this file).
cookie=
cf_clearance=

# --- Local browser modes (to bypass captcha when running locally) ---
# Set these in config.local.properties or via env vars, not here. See Readme.MD.
#
# Option A: Launch Chrome with your real profile (zero interaction, captcha likely skipped).
# Set this to your Chrome user data directory (env var CHROME_PROFILE_DIR), e.g.:
#   Linux: /home/you/.config/google-chrome
#   Windows: C:\Users\you\AppData\Local\Google\Chrome\User Data
#   (macOS: likely to fail due to OS restrictions, use option B instead)
# Chrome must NOT be running when you start the app.
chrome_profile_dir=

# Option B: Attach to an already-running Chrome (minimal interaction), e.g. port 9222
# (env var LOCAL_BROWSER_PORT). ./run.sh starts Chrome and the app for you; manually:
#   google-chrome --remote-debugging-port=9222 --user-data-dir=~/.chrome-steamgifts
# Leave empty to disable (default).
local_browser_port=